# yaml-language-server: $schema=https://raw.githubusercontent.com/MathiasSM/hakyll-site/master/schema/website.schema.json
# Site configuration.
#
# This is the source of truth for the site's identity and the metadata.
#
# It's used by the site's generator (MathiasSM/hakyll-site as of writing).
#
# An example file should be part of the generator's repository.
#
# A few fields can be overridden at build time via environment variables; see
# `.env.example` in the generator (hakyll-site) repository.

# The site's identity. Used for titles, footer, and head elements
site:
  name: MathiasSM
  description: Software Development Engineer
  author: Mathias San Miguel
  copyrightYear: 2013
  domain: mathiassm.dev
  twitterHandle: mathiassm

# How to reach the site owner.
contact:
  email: mathiassanmiguel@gmail.com
  page: /contact

# Web app manifest colours
manifest:
  backgroundColor: "#fff"
  themeColor: "hsl(210, 75%, 50%)"

# MathJax CDN version used to render math on pages that use it.
mathjax:
  version: "4.1.3"

# Atom feed size (number of most recent posts per feed).
feed:
  size: 20

# robots.txt disallow rules.
robots:
  disallow: [/example, /404.html]

# .well-known/security.txt
security:
  preferredLanguages: en, es
  expires: "2027-06-01T00:00:00.000Z"
  expirationMarginDays: 90

# .well-known/trust.txt
trust:
  trainingAllowed: "no"

# funding.json manifest
funding:
  entity:
    email: mathiassanmiguel@gmail.com
    description: "Mathias is a Software Developer Engineer."
  projects: []
  channels: []
  plans: []
